[package]
name = "hubpro"
version = "1.0.1"
description = "HubPro - Modern Project Workspace & To-Do Hub"
authors = ["Stef"]
edition = "2021"

[lib]
name = "hubpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
